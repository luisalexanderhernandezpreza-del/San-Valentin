

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¿Quieres ser mi San Valentín? 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            animation: fadeIn 2s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: #7a1f3d;
            margin-bottom: 15px;
        }

        p {
            font-size: 1rem;
            color: #4a4a4a;
            margin-bottom: 20px;
        }

        .photo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin: 20px auto;
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .yes {
            background: #ff4d6d;
            color: white;
            box-shadow: 0 8px 20px rgba(255,77,109,0.4);
        }

        .yes:hover {
            transform: scale(1.1);
            background: #ff1e4d;
        }

        .no {
            background: #f1f1f1;
            color: #555;
        }

        .no:hover {
            transform: translateX(10px);
        }

        .hidden {
            display: none;
        }

        .love-message {
            font-size: 1.2rem;
            color: #7a1f3d;
            margin-top: 20px;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: rgba(255, 0, 80, 0.6);
            font-size: 20px;
            animation: float 6s infinite ease-in;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.8);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="hearts"></div>

<div class="card">
    <h1>Para ti, mi amor🤍</h1>

    <p>
        Desde que llegaste a mi vida, todo es más bonito.  
        Tus sonrisas, tus abrazos y tu forma de amar hacen que cada día valga la pena.
    </p>

    <!-- CAMBIA LA IMAGEN AQUÍ -->
    <img src="Mi tiquita.jpg" alt="Mi amor" class="photo">

    <p>
        Y hoy quiero preguntarte algo muy especial…
    </p>

    <h1>¿Quieres ser mi San Valentín? 💘</h1>

    <div class="buttons">
        <button class="yes" onclick="sayYes()">Sí 🥰</button>
        <button class="no" onclick="moveNo(this)">No 🙈</button>
    </div>

    <div id="message" class="love-message hidden">
        Sabía que dirías que sí 💕 
        Prometo hacerte sentir amada hoy y siempre. 🌹
    </div>
</div>

<script>
    function sayYes() {
        document.getElementById("message").classList.remove("hidden");
    }

    function moveNo(btn) {
        const x = Math.random() * 100 - 50;
        const y = Math.random() * 100 - 50;
        btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Corazones flotando
    const heartsContainer = document.querySelector('.hearts');

    setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heartsContainer.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }, 300);
</script>

</body>
</html>
